apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  namespace: flask-app
labels:
  app: flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: gangadhar369/flask-microservice:latest
          ports:
            - containerPort: 5000
          env:
            - name: SKIP_DB
              value: "true"
