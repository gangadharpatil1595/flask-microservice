version: "3.9"

services:
  microservice-db:
    image: postgres:13
    container_name: microservice-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  microservice-app:
    build: .
    container_name: microservice-app
    command: python app.py
    ports:
      - "5000:5000"
    depends_on:
      microservice-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@microservice-db:5432/test

volumes:
  postgres_data:

